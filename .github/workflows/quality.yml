name: quality

on:
  push:
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest
        env:
          IMAGE_STUDIO_NO_BOOTSTRAP: "1"
      - run: python -m ruff check image_studio tests
      - run: python -m mypy image_studio

