[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["smoke: fast compatibility smoke tests", "gpu: optional GPU integration tests"]

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = ["image_studio_webui.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"image_studio/runtime.py" = ["E402", "F401", "F821", "I001"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
exclude = [
    "image_studio_webui.py",
    "image_studio/runtime.py",
    "image_studio/pipelines/",
    "image_studio/generators/(boogu|chat|hidream|ideogram|krea2|qwen|zimage).py",
    "image_studio/ui/components/",
    "image_studio/ui/(gallery_actions|models).py",
]
